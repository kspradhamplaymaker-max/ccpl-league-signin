<style>
:root{--graphite:#333333;--orange:#E07844;--orange-deep:#C9612F;--court:#EDEFEF;--muted:#6B7072;--ink:#262626;
--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Montserrat',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--graphite);color:#fff;font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
.wrap::before{content:"";position:absolute;right:-20%;top:-30%;width:70%;height:160%;
background:linear-gradient(100deg,transparent 0 47%,rgba(224,120,68,.9) 47% 50%,transparent 50% 100%);transform:skewX(-18deg);pointer-events:none}
.logo{position:relative;height:150px;display:block;margin:0 auto 26px}
.card{position:relative;background:#fff;color:var(--ink);border-radius:14px;max-width:440px;width:100%;padding:30px 28px 26px;text-align:center;
box-shadow:0 30px 60px rgba(0,0,0,.35);border-top:5px solid var(--orange)}
h1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:40px;line-height:.95;margin:4px 0 10px;color:var(--graphite)}
p{margin:0 0 16px;color:var(--muted)}
#gbtn{display:flex;justify-content:center;min-height:44px;margin:4px 0 6px}
.note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.err{background:#F9DAD5;color:#6E2216;border-radius:8px;padding:12px;font-size:14px;text-align:left;margin-bottom:12px}
.warn{background:#FFF0D3;color:#6B4A0A;border-radius:8px;padding:12px;font-size:14px;text-align:left;margin-bottom:14px}
.spin{width:22px;height:22px;border:3px solid rgba(0,0,0,.12);border-top-color:var(--orange);border-radius:50%;animation:s .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none}
@media (max-width:480px){.logo{height:110px}h1{font-size:34px}}
</style>

  var w = Math.min(320, document.getElementById('gbtn').clientWidth || 320);
  document.getElementById('gbtn').innerHTML = '';
  google.accounts.id.renderButton(document.getElementById('gbtn'), { type: 'standard', theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'pill', logo_alignment: 'left', width: w });
}
function gisFailed() {
  document.getElementById('gbtn').innerHTML = '';
  show('msg', 'Google sign-in could not load. Check your internet connection, turn off any content blocker for this page, and reload.', 'err');
}
</script>
